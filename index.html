<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jumbo Spot · JSE Insegne Digitali</title>
<meta name="description" content="Jumbo Spot di JSE Insegne Digitali: crea lo spot video per la tua insegna LED partendo dalle tue foto.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2A0A22">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jumbo Spot">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Montserrat:wght@800&family=Playfair+Display:wght@800&family=Anton&family=Fredoka:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#5B1247; --plum-2:#3E0D31; --plum-3:#24081D; --ink:#07030A;
  --red:#CE2623; --green:#1A8B4B; --blue:#3F81CD;
  --text:#FFFFFF; --dim:rgba(255,255,255,.7); --faint:rgba(255,255,255,.16);
  --panel:rgba(20,6,18,.66); --panel-2:rgba(255,255,255,.06); --border:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.28);
  --on-white:#3A0B2E; --sel-bg:rgba(255,255,255,.1);
  --warn-bg:rgba(206,38,35,.18); --warn-ink:#FFD6D4;
  --bezel:#050205;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  background:var(--ink);
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:transparent;color:var(--text);font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%;}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(100deg,#5B1247 0%,#3E0D31 28%,#1D0718 60%,#050205 100%);}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.3px);background-size:7px 7px;}
img{max-width:100%;}
button{font:inherit;color:inherit;}
a{color:#fff;}
.app{max-width:680px;margin:0 auto;padding:10px 16px 24px;}

/* intestazione con marchio */
.topbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin:4px 0 14px;}
.brandbar{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0;}
.brand-mark{height:24px;width:auto;display:block;}
.brand-name{font-weight:900;font-size:1.08rem;letter-spacing:-0.01em;white-space:nowrap;}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:1.25rem;cursor:pointer;color:#fff;}
.icon-btn:focus-visible,.btn:focus-visible,.pill:focus-visible,.seg-btn:focus-visible,.sign-card:focus-visible,.style-card:focus-visible,.dur-card:focus-visible,.trans-item:focus-visible,.dropzone:focus-visible,.frame-drop:focus-visible,.px-tile:focus-visible,.tl-thumb:focus-visible,.tl-trans button:focus-visible{outline:2px solid #fff;outline-offset:2px;}
.page-title{font-size:1.5rem;line-height:1.2;font-weight:800;margin:4px 2px 14px;letter-spacing:-0.01em;}

/* passi: le barre LED del marchio */
.stepper{margin:0 2px 6px;}
.st-bars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.st-bar{height:6px;border-radius:3px;background:var(--faint);}
.st-bar.done.c0{background:var(--red);} .st-bar.done.c1{background:var(--green);} .st-bar.done.c2{background:var(--blue);}
.st-bar.active{background:#fff;}
.st-text{margin:8px 0 0;font-size:.8rem;color:var(--dim);font-weight:600;}

/* home */
.hero{text-align:center;padding:26px 4px 8px;}
.hero-logo{width:min(56%,220px);height:auto;display:block;margin:0 auto 22px;}
.wordmark{font-size:clamp(2.7rem,1.6rem + 6vw,3.8rem);line-height:1;font-weight:900;letter-spacing:-0.03em;margin:0 0 12px;}
.tagline{margin:0 auto 22px;color:var(--dim);max-width:34ch;font-size:1.02rem;}
.foot{text-align:center;color:var(--dim);font-size:.78rem;margin:22px 0 6px;}
.spot-list{list-style:none;margin:0;padding:0;display:grid;gap:10px;}
.spot-item{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:14px;background:var(--panel-2);}
.spot-thumb{height:58px;border-radius:6px;overflow:hidden;background:var(--bezel);border:3px solid var(--bezel);display:flex;align-items:center;justify-content:center;}
.spot-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.spot-meta strong{display:block;font-size:1rem;}
.spot-meta small{color:var(--dim);font-size:.8rem;}
.spot-actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;}

/* pannelli */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px 16px;margin-bottom:12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
.panel h2{font-size:1.06rem;margin:0 0 4px;font-weight:800;}
.panel h3{font-size:.92rem;margin:18px 0 8px;font-weight:800;}
.hint{color:var(--dim);font-size:.88rem;margin:0 0 14px;}
.hint.small{font-size:.8rem;margin:8px 0 0;}
.center{text-align:center;}
.note{color:var(--dim);font-size:.8rem;margin:14px 0 0;}
.progress-note{color:var(--dim);font-size:.86rem;margin:-6px 2px 14px;}

/* bottoni */
.btn{appearance:none;border:none;cursor:pointer;padding:13px 18px;border-radius:12px;font-weight:800;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;}
.btn:active{transform:scale(.985);}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;}
.btn-primary{background:#fff;color:var(--on-white);}
.btn-secondary{background:rgba(255,255,255,.05);color:#fff;border:1.5px solid var(--border-strong);}
.btn-ghost{background:transparent;color:var(--dim);}
.btn-danger{background:var(--red);color:#fff;}
.btn-sm{padding:9px 13px;min-height:40px;font-size:.86rem;}
.btn-lg{min-height:54px;font-size:1.05rem;}
.btn-block{width:100%;}
.btn small{font-weight:600;opacity:.75;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.btn-row.center{justify-content:center;}
.btn-row.end{justify-content:flex-end;}
.actionbar{position:sticky;bottom:0;z-index:5;display:flex;gap:8px;margin:4px -16px 0;padding:14px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(7,3,10,0),rgba(7,3,10,.94) 34%);}
.actionbar .btn{flex:1;}

/* scelta insegna */
.sign-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media (min-width:560px){ .sign-grid{grid-template-columns:repeat(3,1fr);} }
.sign-card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px 12px;border-radius:14px;border:1.5px solid var(--border);background:var(--panel-2);cursor:pointer;text-align:center;color:#fff;}
.sign-card.selected{border-color:#fff;border-width:2px;background:var(--sel-bg);}
.sign-card[disabled]{opacity:.35;cursor:not-allowed;}
.sign-stage{height:98px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:8px;}
.sign-shape{background:var(--bezel);border-radius:4px;padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.4);}
.sign-shape i{display:block;width:100%;height:100%;border-radius:2px;background:linear-gradient(to bottom,var(--red) 0 18%,transparent 18% 41%,var(--green) 41% 59%,transparent 59% 82%,var(--blue) 82%) center/34% 38% no-repeat,linear-gradient(120deg,#6A1854,#24081D);}
.sign-card strong{font-size:1rem;}
.sign-card span{font-size:.84rem;color:var(--dim);}
.sign-card small{font-size:.74rem;color:var(--dim);}

/* brand */
.input{width:100%;padding:12px 13px;border-radius:10px;border:1.5px solid var(--border);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:1rem;}
.input::placeholder{color:rgba(255,255,255,.42);}
.input:focus-visible{outline:2px solid #fff;outline-offset:1px;border-color:transparent;}
.lbl{display:flex;align-items:baseline;gap:8px;font-size:.9rem;font-weight:800;margin:14px 0 6px;}
.lbl .opt{font-weight:600;color:var(--dim);font-size:.8rem;}
.counter{margin-left:auto;font-weight:700;font-size:.78rem;color:var(--dim);font-variant-numeric:tabular-nums;}
.dropzone{width:100%;border:1.5px dashed var(--border-strong);border-radius:12px;padding:22px 14px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;}
.dropzone:hover{border-color:#fff;}
.dz-ico{font-size:1.5rem;}
.dropzone small,.frame-drop small{color:var(--dim);font-size:.8rem;}
.logo-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.logo-box{width:84px;height:84px;border-radius:12px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:10px;}
.logo-box img{max-width:100%;max-height:100%;object-fit:contain;}
.swatch-row{display:flex;gap:18px;flex-wrap:wrap;}
.swatch-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
.swatch{position:relative;width:48px;height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.3);overflow:hidden;display:block;}
.swatch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:none;padding:0;}
.swatch-item small{font-size:.78rem;color:var(--dim);}
.style-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.style-card{border:1.5px solid var(--border);border-radius:14px;background:var(--panel-2);padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:center;color:#fff;}
.style-card.selected{border-color:#fff;border-width:2px;background:var(--sel-bg);}
.style-sample{font-size:1.25rem;line-height:1.1;}
.style-name{font-size:.84rem;color:var(--dim);}
.style-name em{font-style:normal;color:#fff;font-weight:800;margin-left:6px;}

/* durata */
.dur-grid{display:grid;gap:10px;}
.dur-card{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--border);background:var(--panel-2);cursor:pointer;text-align:left;color:#fff;}
.dur-card.selected{border-color:#fff;border-width:2px;background:var(--sel-bg);}
.dur-card strong{font-size:2rem;line-height:1;font-weight:900;font-variant-numeric:tabular-nums;min-width:66px;}
.dur-card strong span{font-size:.8rem;font-weight:700;margin-left:2px;color:var(--dim);}
.dur-card > span{font-size:.92rem;color:var(--dim);}

/* cornice insegna */
.frame{margin:0 auto;background:var(--bezel);border-radius:10px;padding:8px;box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06);}
.screen{position:relative;border-radius:3px;overflow:hidden;background:#000;}
.screen canvas{display:block;width:100%;height:100%;}
.screen canvas.draggable{cursor:grab;touch-action:none;}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(0,0,0,0) 55%,rgba(0,0,0,.2) 100%);}
.frame-drop{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;background:linear-gradient(120deg,#3E0D31,#12040F);color:#fff;cursor:pointer;padding:10px;text-align:center;}

/* pill e segmenti */
.pills{display:flex;flex-wrap:wrap;gap:8px;}
.pill{padding:8px 14px;border-radius:999px;border:1.5px solid var(--border-strong);background:transparent;cursor:pointer;font-size:.88rem;font-weight:700;color:#fff;}
.pill.selected{background:#fff;color:var(--on-white);border-color:#fff;}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.seg-btn{border:1.5px solid var(--border);background:var(--panel-2);border-radius:12px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.86rem;font-weight:700;color:#fff;}
.seg-btn.selected{border-color:#fff;border-width:2px;background:var(--sel-bg);}
.pos-ico{width:44px;height:30px;border-radius:4px;background:rgba(255,255,255,.14);position:relative;display:block;}
.pos-ico i{position:absolute;left:9px;right:9px;height:6px;border-radius:2px;background:#fff;}
.pos-top i{top:4px;} .pos-center i{top:12px;} .pos-bottom i{bottom:4px;}
.seg.seg-4{grid-template-columns:repeat(4,1fr);gap:6px;}
.seg.seg-4 .seg-btn{font-size:.78rem;padding:10px 4px;text-align:center;line-height:1.15;}
.pos-ico.promo i{left:12px;right:12px;height:7px;border-radius:4px;background:var(--red);}
.pos-ico.pos-with i{top:6px;background:#fff;}
.pos-ico.pos-with i + i{top:16px;left:13px;right:13px;height:6px;background:var(--red);}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-left:3px solid var(--red);border-radius:10px;padding:10px 12px;font-size:.86rem;margin:12px 0 0;}

/* transizioni */
.trans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
@media (min-width:520px){ .trans-grid{grid-template-columns:repeat(4,1fr);} }
.trans-item{border:1.5px solid var(--border);background:var(--panel-2);border-radius:12px;padding:6px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.76rem;font-weight:700;text-align:center;line-height:1.2;color:#fff;}
.trans-item canvas{width:100%;aspect-ratio:3/2;border-radius:6px;display:block;background:#000;}
.trans-item.selected{border-color:#fff;border-width:2px;background:var(--sel-bg);}
.trans-item .mix-ico{width:100%;aspect-ratio:3/2;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:conic-gradient(from 30deg,var(--red),var(--green),var(--blue),var(--red));}
.mix-summary{display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--panel-2);border-radius:12px;padding:12px;font-size:.92rem;}

/* player e sequenza */
.player-ctrl{display:flex;align-items:center;gap:10px;margin-top:12px;}
.player-ctrl input[type=range]{flex:1;accent-color:#fff;}
.time{font-size:.8rem;color:var(--dim);font-variant-numeric:tabular-nums;min-width:80px;text-align:right;}
.led-toggle{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-size:.86rem;font-weight:700;cursor:pointer;}
.led-toggle input{width:18px;height:18px;accent-color:#fff;}
.tl{list-style:none;margin:0;padding:0;}
.tl-card{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--panel-2);}
.tl-thumb{width:64px;height:44px;border-radius:6px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;padding:0;}
.tl-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.tl-thumb.logo img{object-fit:contain;padding:4px;}
.tl-body{min-width:0;}
.tl-body strong{display:block;font-size:.95rem;}
.tl-body small{display:block;color:var(--dim);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tl-body .tl-warn{color:var(--warn-ink);background:var(--warn-bg);display:inline-block;border-radius:6px;padding:1px 6px;margin-top:4px;font-size:.74rem;}
.tl-actions{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;}
.tl-actions .btn{min-height:36px;padding:7px 11px;font-size:.82rem;}
.tl-trans{display:flex;justify-content:center;padding:6px 0;position:relative;}
.tl-trans::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1.5px;background:var(--border);}
.tl-trans button{position:relative;border:1.5px solid var(--border-strong);background:#1A0717;border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:700;cursor:pointer;color:#fff;}
.tl-trans button:hover{border-color:#fff;}

/* Pixabay */
.px-search{display:flex;gap:8px;}
.px-search .input{flex:1;}
.px-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;}
.px-tile{border:none;padding:0;border-radius:8px;overflow:hidden;aspect-ratio:1;background:rgba(255,255,255,.06);cursor:pointer;}
.px-tile img{width:100%;height:100%;object-fit:cover;display:block;}
.px-grid.busy{opacity:.4;pointer-events:none;}
.px-kind{margin-bottom:10px;grid-template-columns:repeat(2,1fr);}
.px-tile{position:relative;}
.px-src{position:absolute;right:4px;top:4px;background:rgba(0,0,0,.72);color:#fff;font-size:.62rem;font-weight:800;padding:1px 5px;border-radius:5px;}
.px-dur{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.72);color:#fff;font-size:.72rem;font-weight:800;padding:2px 6px;border-radius:6px;}
.px-credit{font-size:.78rem;color:var(--dim);text-align:center;margin:14px 0 0;}

/* modali e fogli */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,2,6,.66);display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:#1C0818;border:1px solid var(--border);border-radius:18px;padding:20px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:calc(100% - 32px);overflow:auto;}
.modal h3{margin:0 0 8px;font-size:1.12rem;font-weight:800;}
.modal p{margin:0 0 8px;color:var(--dim);font-size:.92rem;}
.modal-logo{height:22px;width:auto;display:block;margin:0 0 14px;}
.sheet-overlay{align-items:flex-end;padding:0;}
.sheet{background:#1C0818;border:1px solid var(--border);border-bottom:none;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));width:100%;max-width:680px;max-height:86%;overflow:auto;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.sheet-head h3{margin:0;font-size:1.06rem;font-weight:800;}
.progress{height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin:14px 0 8px;}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--green),var(--blue));}
.file-name{font-weight:800;word-break:break-all;margin:6px 0 2px;font-size:.94rem;color:#fff !important;}
.howto{background:rgba(255,255,255,.06);border-radius:12px;padding:12px 14px;margin:14px 0 6px;font-size:.88rem;}
.howto ol{margin:6px 0 0;padding-left:20px;}
.howto li{margin:2px 0;}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#fff;color:var(--on-white);font-weight:700;padding:11px 16px;border-radius:12px;font-size:.9rem;max-width:calc(100% - 32px);z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.toast.show{opacity:1;transform:translate(-50%,0);}
@media (prefers-reduced-motion:no-preference){
  .toast{transition:opacity .2s ease,transform .2s ease;}
  .progress-fill{transition:width .15s linear;}
}
</style>
</head>
<body>
<main class="app" id="app"></main>
<div id="modal-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.js"></script>
<script>
(function(){
'use strict';

/* =====================================================================
   CONFIGURAZIONE — modifica qui insegne, testi e durate
   ===================================================================== */
// Passo LED usato per calcolare la risoluzione (prototipo: fisso).
const PITCH_MM = 3.9;
// Insegne disponibili: cm reali e definizione video (DV) ufficiale JSE.
// Le orizzontali sono le verticali con le misure girate.
const SIGNS = [
  { id:'75x50-o',  cmW:75,  cmH:50,  w:192, h:128, size:'small',  orient:'Orizzontale' },
  { id:'50x75-v',  cmW:50,  cmH:75,  w:128, h:192, size:'small',  orient:'Verticale' },
  { id:'100x50-o', cmW:100, cmH:50,  w:256, h:128, size:'medium', orient:'Orizzontale' },
  { id:'50x100-v', cmW:50,  cmH:100, w:128, h:256, size:'medium', orient:'Verticale' },
  { id:'100x75-o', cmW:100, cmH:75,  w:256, h:192, size:'large',  orient:'Orizzontale' },
  { id:'75x100-v', cmW:75,  cmH:100, w:192, h:256, size:'large',  orient:'Verticale' }
];
// Altezza del testo in pixel reali dell'insegna (1 px ≈ 3,9 mm):
// più grande l'insegna, più grande la scritta (circa 5,9 / 6,6 / 7,8 cm).
const TEXT_PX = {
  small:  { text:15, promo:12 },
  medium: { text:17, promo:13 },
  large:  { text:20, promo:15 }
};

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const app = $('#app');
const modalRoot = $('#modal-root');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const easeInOut = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeSine = t => -(Math.cos(Math.PI * t) - 1) / 2;
const easeOutBack = t => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3*Math.pow(t - 1, 3) + c1*Math.pow(t - 1, 2); };
const signOf = p => SIGNS.find(s => s.id === p.signId);
const transLabel = id => (TRANSITIONS.find(t => t.id === id) || TRANSITIONS[0]).label;
const fmtTime = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
function makeCanvas(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function sizeBuf(c, w, h){ if (c.width !== w || c.height !== h){ c.width = w; c.height = h; } }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3200); }
function signLabel(s){ return s.cmW + 'x' + s.cmH + ' cm ' + s.orient.toLowerCase(); }

function hexToRgb(h){ h = String(h || '#000').replace('#',''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16) || 0; return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 }; }

// Limiti di caratteri calcolati dalla larghezza reale dell'insegna.
function limitsFor(sign){
  const px = TEXT_PX[sign.size];
  const usable = sign.w * (1 - 2*MARGIN);
  const perLine = Math.max(8, Math.floor((usable - px.text*0.9) / (px.text*0.6)));

}

   ===================================================================== */
const DB = {
  db: null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open('jse-spot-insegne', 2);
        r.onupgradeneeded = () => {
          const db = r.result;
          if (!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', { keyPath:'id' });
          if (!db.objectStoreNames.contains('media')) db.createObjectStore('media', { keyPath:'id' });
        };
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => rej(r.error);
      } catch (e){ rej(e); }
    });
  },
  async run(mode, fn, store){
    store = store || 'projects';
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, mode); const req = fn(tx.objectStore(store)); let out;
      if (req) req.onsuccess = () => { out = req.result; };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  all(){ return this.run('readonly', st => st.getAll()); },
  put(p){ return this.run('readwrite', st => st.put(p)); },
  del(id){ return this.run('readwrite', st => st.delete(id)); }
};

// Legge un video e ne ricava un fotogramma di anteprima (poster).
async function importVideo(blob){
  const url = URL.createObjectURL(blob); const el = makeVideoEl(url);
  await waitVideo(el, 20000);
  if (!el.videoWidth || !isFinite(el.duration)) throw new Error('video');
  await seekVideo(el, Math.min(.5, el.duration/2));
  const k = Math.min(1, 720 / Math.max(el.videoWidth, el.videoHeight));
  const c = makeCanvas(Math.round(el.videoWidth*k), Math.round(el.videoHeight*k));

    out.push({ el, active: t >= seg.start - TR/2 - .05 && t <= seg.start + seg.dur + TR/2 + .05, time: videoTimeFor(seg.slide, t - seg.start, el) });

// Anteprima: i video scorrono in sincronia con la timeline dello spot.
function syncVideos(p, segs, t, playing){
  videoStates(p, segs, t).forEach(v => {
    const el = v.el;
    if (!v.active){ if (!el.paused) el.pause(); return; }
    if (playing){
      if (el.paused){ try { el.currentTime = v.time; } catch (e){} const pr = el.play(); if (pr && pr.catch) pr.catch(() => {}); }
      else { const drift = Math.abs(el.currentTime - v.time); if (drift > .35 && drift < el.duration - .35){ try { el.currentTime = v.time; } catch (e){} } }
    } else {
      if (!el.paused) el.pause();
      if (!el.seeking && Math.abs(el.currentTime - v.time) > .04){ try { el.currentTime = v.time; } catch (e){} }
    }
  });
}
// Esportazione: ogni video viene portato al fotogramma esatto prima di disegnare.
async function seekVideosFor(p, segs, t){

// Analisi del logo: sfondo (se non trasparente), colori principali, luminosità.
function analyzeLogo(src){
  const w = 80, h = Math.max(1, Math.round(80 * src.height / src.width));
  const c = makeCanvas(w, h), x = c.getContext('2d'); x.drawImage(src, 0, 0, w, h);
  let d; try { d = x.getImageData(0, 0, w, h).data; } catch (e){ return { bg:null, colors:[], lum:.5 }; }
  const px = (i, j) => { const k = (j*w + i)*4; return [d[k], d[k+1], d[k+2], d[k+3]]; };
  const cs = [px(0,0), px(w-1,0), px(0,h-1), px(w-1,h-1)];
  let bg = null, opaqueAvg = null;
  if (cs.every(q => q[3] > 220)){
    const avg = [0,1,2].map(k => cs.reduce((s, q) => s + q[k], 0) / 4);
    opaqueAvg = rgbToHex(avg[0], avg[1], avg[2]);
    const spread = Math.max.apply(null, cs.map(q => Math.abs(q[0]-avg[0]) + Math.abs(q[1]-avg[1]) + Math.abs(q[2]-avg[2])));
    if (spread < 60) bg = avg;
  }
  const buckets = new Map(); let lsum = 0, lcount = 0;
  for (let k = 0; k < d.length; k += 4){
    const r = d[k], g = d[k+1], b = d[k+2], a = d[k+3];
    if (a < 140) continue;
    if (bg && Math.abs(r-bg[0]) + Math.abs(g-bg[1]) + Math.abs(b-bg[2]) < 60) continue;
    lsum += (.2126*r + .7152*g + .0722*b) / 255; lcount++;
    const hsl = rgbToHsl(r, g, b);
    if (hsl[1] < .2 || hsl[2] < .1 || hsl[2] > .92) continue;
    const key = Math.round(hsl[0]*24) + '|' + Math.round(hsl[2]*4);
    const cur = buckets.get(key) || { n:0, r:0, g:0, b:0 };
    cur.n++; cur.r += r; cur.g += g; cur.b += b; buckets.set(key, cur);
  }
  const sorted = Array.from(buckets.values()).sort((a, b) => b.n - a.n);
  const picked = [];
  for (const bk of sorted){
    if (bk.n < 4) break;
    const col = [bk.r/bk.n, bk.g/bk.n, bk.b/bk.n]; const hh = rgbToHsl(col[0], col[1], col[2])[0];
    if (picked.every(q => hueDist(q.h, hh) > .07)) picked.push({ h: hh, hex: rgbToHex(col[0], col[1], col[2]) });
    if (picked.length >= 3) break;
  }
  return { bg: bg ? rgbToHex(bg[0], bg[1], bg[2]) : null, opaqueAvg, colors: picked.map(q => q.hex), lum: lcount ? lsum/lcount : .5 };
}
function suggestStyle(colors){

  if (hsl[2] < .3 || hsl[1] < .35) return 'elegante';
  if ((hsl[0] < .06 || hsl[0] > .94) && hsl[1] > .6) return 'deciso';
  if (hsl[2] > .55 && hsl[1] > .5) return 'giocoso';

}

const bufA = makeCanvas(1,1), bufB = makeCanvas(1,1), tmpC = makeCanvas(1,1), measureC = makeCanvas(8,8);
const layoutInfo = new Map();

function timeline(p){

  const segs = [{ type:'intro', start:0, dur:INTRO }]; let t = INTRO;
  p.slides.forEach((s, i) => { segs.push({ type:'slide', slide:s, i, start:t, dur:each, trans:s.transIn || 'fade' }); t += each; });

}

  const s = segs[i];

  if (i < segs.length - 1 && t > segs[i+1].start - TR/2) return renderTrans(ctx, W, H, s, segs[i+1], t, p, (t - (segs[i+1].start - TR/2)) / TR);

}

}

let thumbRaf = 0, samples = null;
function sampleFrames(){

  const A = makeCanvas(w, h), a = A.getContext('2d');
  let g = a.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#FFB347'); g.addColorStop(1, '#E4572E'); a.fillStyle = g; a.fillRect(0, 0, w, h);

  b.fillStyle = 'rgba(255,255,255,.9)'; rr(b, w*.35, h*.25, w*.3, h*.5, 4); b.fill();

}

function pxCacheGet(k){ try { const v = JSON.parse(localStorage.getItem('px:' + k) || 'null'); if (v && Date.now() - v.t < PX_CACHE_MS) return v.d; } catch (e){} return null; }

function pxCacheSet(k, d){ try { localStorage.setItem('px:' + k, JSON.stringify({ t: Date.now(), d })); } catch (e){ pxCachePrune(true); } }
// Una sola ricerca: il server interroga Pixabay, Pexels e Unsplash insieme e mescola i risultati.
async function pxSearch(q, page, orient, kind){
  const prm = new URLSearchParams({ q, kind, page:String(page) });
  if (orient) prm.set('orient', orient);
  const ck = 'all:' + prm.toString(); const cached = pxCacheGet(ck); if (cached) return cached;
  const res = await fetch(PX_API + '?' + prm.toString(), { credentials:'same-origin' });
  const fail = code => { const e = new Error(code); e.code = code; throw e; };
  if (res.status === 429) fail('rate');
  if (res.status === 401) fail('auth');
  if (res.status === 503) fail('nokey');
  if (res.status === 404 || res.status === 405) fail('noproxy');
  if (!res.ok) fail('http');
  if ((res.headers.get('content-type') || '').indexOf('json') < 0) fail('noproxy');
  const data = await res.json();
  const out = { hits: (data.hits || []).filter(h => h.large), more: !!data.more };
  pxCacheSet(ck, out); return out;
}
// Prima prova a scaricare direttamente dalla libreria; se il browser lo blocca, passa dal server del sito.
async function pxDownload(hit, kind){
  for (const url of (kind === 'video' ? [hit.large, hit.alt] : [hit.large, hit.prev]).filter(Boolean)){
    for (const via of [url, PX_MEDIA + '?u=' + encodeURIComponent(url)]){
      try {
        const r = await fetch(via, via === url ? { mode:'cors' } : { credentials:'same-origin' });
        if (r.ok){ const b = await r.blob(); if (b.size) return b; }
      } catch (e){}
    }
  }
  throw new Error('download');
}
function openPixabay(sign, onPick){
  const st = { q:'', page:1, orient: sign.w >= sign.h ? 'h' : 'v', hits:[], more:false, busy:false, kind:'photo' };
  modalRoot.innerHTML = '<div class="overlay sheet-overlay" id="sheet-ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="Cerca online"><div class="sheet-head"><h3>Cerca online</h3><button class="icon-btn" id="sheet-x" aria-label="Chiudi">✕</button></div>' +
    ('<div class="seg px-kind" id="px-kind"><button type="button" class="seg-btn selected" data-k="photo">Foto</button><button type="button" class="seg-btn" data-k="video">Video</button></div><div class="px-search"><input class="input" id="px-q" type="search" placeholder="Es. paella, pizza, tende da sole" enterkeyhint="search" autocomplete="off"><button class="btn btn-primary" id="px-go">Cerca</button></div><p class="hint small" id="px-status">Scrivi cosa cerchi, anche in italiano: cerco in più librerie gratuite insieme.</p><div class="px-grid" id="px-grid"></div><div class="btn-row center"><button class="btn btn-secondary btn-sm" id="px-more" hidden>Mostra altri risultati</button></div>') +
    '<p class="px-credit">Foto e video gratuiti da <a href="https://pixabay.com/" target="_blank" rel="noopener">Pixabay</a>, <a href="https://www.pexels.com/" target="_blank" rel="noopener">Pexels</a> e <a href="https://unsplash.com/?utm_source=jumbo_spot&amp;utm_medium=referral" target="_blank" rel="noopener">Unsplash</a></p></div></div>';

  $('#sheet-ov').onclick = e => { if (e.target.id === 'sheet-ov') closeModal(); };

    grid.innerHTML = st.hits.map((h, i) => '<button type="button" class="px-tile" data-i="' + i + '">' + (h.prev ? '<img src="' + esc(h.prev) + '" alt="' + (st.kind === 'video' ? 'Video' : 'Foto') + ' di ' + esc(h.user) + '" loading="lazy">' : '') + (st.kind === 'video' ? '<span class="px-dur">▶ ' + Math.round(h.dur) + ' s</span>' : '') + '<span class="px-src">' + esc(SOURCES[h.src] || '') + '</span></button>').join('');

        closeModal(); await onPick(blob, hit, kind);
      }

      finally { st.busy = false; grid.classList.remove('busy'); }
    });
  };
  const run = async (append) => {
    if (st.busy) return; const q = qEl.value.trim(); if (!q){ qEl.focus(); return; }

    try {
      const r = await pxSearch(st.q, st.page, st.orient, st.kind);
      const seen = new Set(st.hits.map(h => h.id));
      st.more = r.more; st.hits = st.hits.concat(r.hits.filter(h => !seen.has(h.id)));
      say(st.hits.length ? (st.kind === 'video' ? 'Tocca un video per usarlo nello spot.' : 'Tocca una foto per usarla nello spot.') : 'Nessun risultato: prova con un\'altra parola.');
      render();
    } catch (e){
      if (e.code === 'rate') say('Troppe ricerche in poco tempo: riprova tra un minuto.');
      else if (e.code === 'nokey') say('Mancano le chiavi delle librerie nelle impostazioni del sito su Netlify.');
      else if (e.code === 'auth') say('La sessione è scaduta: ricarica la pagina ed entra di nuovo.');
      else if (e.code === 'noproxy' || IN_CLAUDE) say(IN_CLAUDE ? 'In questa anteprima la ricerca online non è disponibile: funziona sul sito di Jumbo Spot.' : 'La ricerca online non è attiva su questo sito: manca la funzione del server.');

  $('#px-go').onclick = () => run(false);
  $$('#px-kind .seg-btn').forEach(b => b.onclick = () => {
    if (st.busy || st.kind === b.dataset.k) return; st.kind = b.dataset.k;

    st.hits = []; st.more = false; render();

  });
  qEl.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); run(false); } };

}

function screenHTML(sign, inner){
  const maxVh = (52 * sign.w / sign.h).toFixed(1);
  return '<div class="frame" style="max-width:min(100%, ' + maxVh + 'vh)"><div class="screen" style="aspect-ratio:' + sign.w + ' / ' + sign.h + '">' + inner + '</div></div>';
}

/* ---------- I miei spot ---------- */
async function renderHome(){
  project = null;
  let list = [], dbOk = true;
  try { list = (await DB.all()) || []; } catch (e){ dbOk = false; }
  list.sort((a, b) => b.updatedAt - a.updatedAt);
  const item = (p) => {
    const s = SIGNS.find(x => x.id === p.signId) || SIGNS[0];
    const ph = (p.slides.find(x => x.photo) || {}).photo;
    return '<li class="spot-item"><div class="spot-thumb" style="aspect-ratio:' + s.w + ' / ' + s.h + '">' + (ph ? '<img src="' + ph + '" alt="">' : '<span aria-hidden="true">🎬</span>') + '</div>' +
      '<div class="spot-meta"><strong>' + esc(p.bizName || 'Spot senza nome') + '</strong><small>Insegna ' + esc(signLabel(s)) + '<br>' + (p.duration ? p.duration + ' secondi, ' : '') + p.slides.filter(x => x.photo).length + ' foto — ' + new Date(p.updatedAt).toLocaleDateString('it-IT') + '</small></div>' +
      '<div class="spot-actions"><button class="btn btn-primary btn-sm" data-open="' + p.id + '">Apri e modifica</button><button class="btn btn-secondary btn-sm" data-dup="' + p.id + '">Duplica</button><button class="btn btn-ghost btn-sm" data-del="' + p.id + '">Elimina</button></div></li>';
  };
  app.innerHTML =
    '<section class="hero"><img class="hero-logo" src="' + LOGO_FULL + '" alt="JSE Insegne Digitali"><h1 class="wordmark">Jumbo Spot</h1>' +
    '<p class="tagline">Crea lo spot per la tua insegna LED partendo dalle tue foto, pronto da caricare sulla Jumbo Screen Platform.</p>' +
    '<button class="btn btn-primary btn-block btn-lg" id="new">Crea un nuovo spot</button></section>' +
    '<section class="panel"><h2>I miei spot</h2>' +
    (list.length ? '<ul class="spot-list">' + list.map(item).join('') + '</ul>' : '<p class="hint">Gli spot che crei compaiono qui: puoi riaprirli per cambiare una scritta o la promo della settimana.</p>') +
    '<p class="note">' + (dbOk ? 'Gli spot restano salvati solo su questo telefono.' : 'Su questo browser il salvataggio non è disponibile: esporta il video prima di chiudere.') + '</p></section>' +
    '<p class="foot">Jumbo Spot è un servizio di JSE Insegne Digitali' + (IN_CLAUDE ? '' : ' · <a href="/logout">Esci</a>') + '</p>';
  $('#new').onclick = () => { project = newProject(); go('sign'); };
  $$('[data-open]').forEach(b => b.onclick = async () => {
    project = list.find(x => x.id === b.dataset.open); if (!project) return;
    const withPhoto = project.slides.filter(s => s.photo).length;
    if (!project.duration) go('brand');
    else if (!withPhoto){ if (!project.slides.length) project.slides.push(newSlide()); go('editor', { index:0, mode:'build' }); }
    else { project.slides = project.slides.filter(s => s.photo); go('review'); }
  });
  $$('[data-dup]').forEach(b => b.onclick = async () => {
    const src = list.find(x => x.id === b.dataset.dup); if (!src) return;
    const copy = JSON.parse(JSON.stringify(src)); copy.id = uid(); copy.createdAt = copy.updatedAt = Date.now();
    copy.bizName = (copy.bizName || 'Spot') + ' (copia)';
    copy.slides.forEach(s => s.id = uid());
    try { await DB.put(copy); toast('Spot duplicato'); } catch (e){ toast('Non riesco a duplicare: spazio insufficiente sul telefono.'); }
    go('home');
  });
  $$('[data-del]').forEach(b => b.onclick = async () => {
    const ok = await confirmModal('Eliminare lo spot?', 'Lo spot verrà cancellato da questo telefono. I video già scaricati non vengono toccati.', 'Elimina', true);
    if (!ok) return; try { await DB.del(b.dataset.del); } catch (e){} await gcMedia(); go('home');
  });
}

    '<section class="panel"><h2>Colori</h2><p class="hint">' + (p.logo ? 'Presi dal logo. ' : '') + 'Tocca un colore per cambiarlo.</p><div class="swatch-row">' +
    swatch('primary', 'Principale', p.colors.primary) + swatch('secondary', 'Secondario', p.colors.secondary) + swatch('logoBg', 'Sfondo logo', p.logoBg) +
    '</div></section>' +
    '<section class="panel"><h2>Stile delle scritte</h2><p class="hint">Come appariranno le scritte sull\'insegna.</p><div class="style-grid">' +
    Object.keys(FONT_STYLES).map(k => { const f = FONT_STYLES[k]; return '<button type="button" class="style-card' + (p.fontStyle === k ? ' selected' : '') + '" data-s="' + k + '"><span class="style-sample" style="font-family:\'' + f.family + '\';font-weight:' + f.weight + '">Offerta -20%</span><span class="style-name">' + f.label + (p.styleSuggested === k ? '<em>consigliato</em>' : '') + '</span></button>'; }).join('') +
    '</div></section>' +
    '<div class="actionbar"><button class="btn btn-primary btn-block" id="next">Continua</button></div>';
  bindTopbar(async () => { await saveNow(); go('home'); });
  $('#biz').oninput = e => { p.bizName = e.target.value; touch(); };
  $('#logo-pick').onclick = () => $('#logo-input').click();
  $('#logo-input').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const res = await importImage(file, 600, 'image/png');
      const info = analyzeLogo(res.canvas);
      p.logo = res.dataUrl;
      p.logoBg = info.bg || info.opaqueAvg || (info.lum > .6 ? '#14171C' : '#FFFFFF');
      p.colors.primary = info.colors[0] || '#FFB347';
      if (info.colors[1]) p.colors.secondary = info.colors[1];
      else { const c = hexToRgb(p.colors.primary); const h = rgbToHsl(c.r, c.g, c.b); p.colors.secondary = hslToHex(h[0], clamp(h[1], .3, .9), clamp(h[2]*.55, .15, .45)); }
      p.styleSuggested = suggestStyle(info.colors); p.fontStyle = p.styleSuggested;
      await loadImg(p.logo); touch(); renderBrand();

  $$('input[type=color]').forEach(inp => inp.oninput = e => {
    const k = e.target.dataset.k, v = e.target.value;

  $('#next').onclick = () => {
    if (!p.bizName.trim() && !p.logo){ toast('Scrivi il nome dell\'attività o carica il logo.'); $('#biz').focus(); return; }
    go('duration');
  };
}

  const p = project;
  app.innerHTML = topbar('Durata dello spot', 2) +
    '<section class="panel"><h2>Quanto deve durare lo spot?</h2><p class="hint">Ogni foto resta a schermo abbastanza a lungo da essere vista da chi passa.</p><div class="dur-grid">' +
    [15, 30, 45].map(d => { const r = DURATIONS[d]; return '<button type="button" class="dur-card' + (p.duration === d ? ' selected' : '') + '" data-d="' + d + '"><strong>' + d + '<span>sec</span></strong><span>' + (d === 15 ? 'Logo + 1 foto (massimo 2)' : r.rec + ' foto consigliate (da ' + r.min + ' a ' + r.max + ')') + '</span></button>'; }).join('') +
    '</div></section><div class="actionbar"><button class="btn btn-primary btn-block" id="next"' + (p.duration ? '' : ' disabled') + '>Continua</button></div>';
  bindTopbar(() => go('brand'));
  $$('.dur-card').forEach(b => b.onclick = async () => {
    const d = +b.dataset.d, r = DURATIONS[d], n = p.slides.filter(s => s.photo).length;
    if (n > r.max){ await infoModal('Troppe foto per ' + d + ' secondi', 'Con ' + d + ' secondi puoi usare al massimo ' + r.max + ' foto. Ne hai ' + n + ': scegli una durata più lunga o togline qualcuna dallo spot.'); return; }
    p.duration = d; touch(); $$('.dur-card').forEach(x => x.classList.toggle('selected', x === b)); $('#next').disabled = false;

    if (!p.slides.length) p.slides.push(newSlide());
    touch(); go('editor', { index:0, mode:'build' });
  };
}

/* ---------- Step 4: costruzione / modifica di una foto ---------- */
async function renderEditor(){
  const p = project, sign = signOf(p), lim = limitsFor(sign), rule = DURATIONS[p.duration];
  const idx = params.index || 0, mode = params.mode || 'build';
  const s = p.slides[idx]; if (!s){ go('review'); return; }
  await loadAssets(p); await ensureFonts(p);
  const W = sign.w*PREVIEW_SCALE, H = sign.h*PREVIEW_SCALE, n = p.slides.length, isFirst = idx === 0;
  const mixSummary = p.mix && !isFirst && mode === 'build' && !params.showGrid;
  app.innerHTML = topbar(mode === 'build' ? 'Foto ' + (idx + 1) : 'Modifica foto ' + (idx + 1), mode === 'build' ? 3 : 4) +
    (mode === 'build' ? '<p class="progress-note">Foto ' + (idx + 1) + ' di ' + rule.rec + ' consigliate per uno spot da ' + p.duration + ' secondi.</p>' : '') +
    '<section class="panel"><h2>Foto o video</h2>' +
    screenHTML(sign, '<canvas id="ed-canvas" width="' + W + '" height="' + H + '"' + (s.photo ? ' class="draggable"' : '') + '></canvas>' +
      (s.photo ? '' : '<button type="button" class="frame-drop" id="photo-pick"><span class="dz-ico" aria-hidden="true">📷</span><strong>Carica una foto o un video</strong><small>dalla galleria del telefono</small></button>')) +
    (s.photo ? '<p class="hint small center">Trascina per scegliere l\'inquadratura.' + (s.credit ? ' ' + (s.videoId ? 'Video' : 'Foto') + ' di <a href="' + esc(s.credit.page || '#') + '" target="_blank" rel="noopener">' + esc(s.credit.user) + '</a> su ' + esc(SOURCES[s.credit.src] || 'Pixabay') + '.' : '') + '</p>' : '') +
    '<div class="btn-row center"><button class="btn btn-secondary btn-sm" id="photo-pick2">' + (s.photo ? 'Cambia dalla galleria' : 'Scegli dalla galleria') + '</button><button class="btn btn-secondary btn-sm" id="px-open">Cerca online</button></div>' +
    '<p class="hint small center" id="media-status" hidden></p>' +
    '<input type="file" id="photo-input" accept="image/*,video/*" hidden>' +
    '<h3>' + (s.videoId ? 'Movimento del video' : 'Movimento della foto') + '</h3><div class="pills" id="kb">' + KB_MODES.map(m => '<button type="button" class="pill' + (s.kb === m.id ? ' selected' : '') + '" data-v="' + m.id + '">' + m.label + '</button>').join('') + '</div></section>' +
    '<section class="panel"><h2>Posizione della scritta</h2><p class="hint">Mettila dove non copre il soggetto della foto.</p><div class="seg" id="pos">' +
    POSITIONS.map(o => '<button type="button" class="seg-btn' + (s.pos === o.id ? ' selected' : '') + '" data-v="' + o.id + '"><span class="pos-ico pos-' + o.id + '" aria-hidden="true"><i></i></span>' + o.label + '</button>').join('') + '</div></section>' +
    '<section class="panel"><h2>Scritta</h2>' +
    '<label class="lbl" for="txt">Scritta <span class="counter" id="txt-c"></span></label>' +
    '<input class="input" id="txt" type="text" maxlength="' + lim.text + '" placeholder="Es. Pizza napoletana" value="' + esc(s.text) + '">' +
    '<p class="hint small">Su questa insegna: circa ' + lim.perLine + ' caratteri per riga, fino a ' + TEXT_MAX_LINES + ' righe. Più testo scrivi, più spazio occupa sulla foto.</p>' +
    '<label class="lbl" for="promo">Offerta <span class="opt">facoltativa</span><span class="counter" id="promo-c"></span></label>' +
    '<input class="input" id="promo" type="text" maxlength="' + lim.promo + '" placeholder="Es. -20% oggi" value="' + esc(s.promo) + '">' +
    '<div id="promo-pos-wrap"' + ((s.promo || '').trim() ? '' : ' hidden') + '><p class="lbl">Dove metti l\'offerta</p><div class="seg seg-4" id="promo-pos">' +
    PROMO_POSITIONS.map(o => '<button type="button" class="seg-btn' + ((s.promoPos || 'with') === o.id ? ' selected' : '') + '" data-v="' + o.id + '"><span class="pos-ico promo pos-' + o.id + '" aria-hidden="true"><i></i>' + (o.id === 'with' ? '<i></i>' : '') + '</span>' + o.label + '</button>').join('') +
    '</div><p class="hint small">Così puoi mettere la scritta in basso e l\'offerta in alto, o viceversa.</p></div>' +
    '<p class="warn" id="warn" hidden>Il testo è lungo per questa insegna e risulterà piccolo. Prova ad accorciarlo.</p>' +
    '<div class="btn-row">' + (idx > 0 ? '<button class="btn btn-secondary btn-sm" id="copy-prev">Usa la scritta della foto precedente</button>' : '') +
    (mode === 'edit' && n > 1 ? '<button class="btn btn-secondary btn-sm" id="copy-all">Usa questa scritta su tutte le foto</button>' : '') + '</div></section>' +
    '<section class="panel"><h2>Transizione</h2><p class="hint">Come entra questa foto ' + (isFirst ? 'dopo il logo iniziale' : 'dopo la foto precedente') + '.</p>' +
    (mixSummary ? '<div class="mix-summary"><span>Mix attivo: questa foto entra con <strong>' + esc(transLabel(s.transIn)) + '</strong>.</span><button class="btn btn-secondary btn-sm" id="show-grid">Scegline un\'altra</button></div>'
                : transGridHTML(s.transIn, true, isFirst && p.mix)) + '</section>' +
    '<div class="actionbar">' + (mode === 'build'
      ? '<button class="btn btn-secondary" id="add"' + (n >= rule.max ? ' disabled' : '') + '>Aggiungi foto <small>' + n + '/' + rule.max + '</small></button><button class="btn btn-primary" id="create">Crea spot</button>'
      : '<button class="btn btn-primary btn-block" id="done">Fatto</button>') + '</div>';

  const cv = $('#ed-canvas'), ctx = cv.getContext('2d');
  const edVid = videoOf(s);
  const draw = () => {
    ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = s.photo ? '#000' : '#1A1F27'; ctx.fillRect(0, 0, W, H);
    const img = (edVid && edVid.readyState >= 2) ? edVid : imgReady.get(s.photo); if (img) drawPhoto(ctx, W, H, img, s, idx, 0);
    drawTexts(ctx, W, H, s, 99, p); ctx.restore();
    const sh = layoutInfo.get(s.id); $('#warn').hidden = !(sh < .8);
    $('#txt-c').textContent = (s.text || '').length + ' / ' + lim.text;
    $('#promo-c').textContent = (s.promo || '').length + ' / ' + lim.promo;
  };
  draw();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (document.body.contains(cv)) draw(); });
  if (edVid){ // il video scorre in loop dentro l'anteprima dell'editor
    pauseAllVideos(); try { edVid.currentTime = s.clipStart || 0; } catch (e){} const pr = edVid.play(); if (pr && pr.catch) pr.catch(() => {});
    const vloop = () => { if (!document.body.contains(cv)){ edVid.pause(); return; } draw(); requestAnimationFrame(vloop); };
    requestAnimationFrame(vloop);
  }

  // trascinamento per l'inquadratura
  let drag = null;
  cv.addEventListener('pointerdown', e => { if (!s.photo) return; drag = { x:e.clientX, y:e.clientY, cx:s.cx, cy:s.cy }; try { cv.setPointerCapture(e.pointerId); } catch (_){} });
  cv.addEventListener('pointermove', e => {
    if (!drag) return; const img = imgReady.get(s.photo); if (!img) return;
    const r = cv.getBoundingClientRect(); const bc = baseCrop(img, W, H);
    const fw = bc.cw / mw(img), fh = bc.ch / mh(img);
    const cc = (v, f) => f >= .999 ? .5 : clamp(v, f/2, 1 - f/2);
    s.cx = cc(drag.cx - (e.clientX - drag.x)/r.width*fw, fw);
    s.cy = cc(drag.cy - (e.clientY - drag.y)/r.height*fh, fh);
    draw();
  });
  const endDrag = () => { if (drag){ drag = null; touch(); } };
  cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

  $$('#photo-pick, #photo-pick2').forEach(b => b.onclick = () => $('#photo-input').click());
  const mediaStatus = t => { const m = $('#media-status'); if (m){ m.hidden = !t; m.textContent = t || ''; } };
  const usePhoto = async (blobOrFile, credit) => {
    const res = await importImage(blobOrFile, PHOTO_MAX_SIDE, 'image/jpeg', .86);
    s.photo = res.dataUrl; s.videoId = null; s.cx = .5; s.cy = .5; s.credit = credit || null; videoEls.delete(s.id);
    if (s.kb === 'still') s.kb = 'auto';
    await loadImg(s.photo); touch(); go('editor', params);
  };
  const useVideo = async (blob, credit) => {
    mediaStatus('Preparo il video…');
    const v = await importVideo(blob);
    s.videoId = await putMedia(blob); s.photo = v.poster; s.clipStart = 0; s.cx = .5; s.cy = .5; s.credit = credit || null;
    if (s.kb === 'auto') s.kb = 'still';
    videoEls.set(s.id, { el: v.el, videoId: s.videoId });
    await loadImg(s.photo); touch(); await saveNow(); go('editor', params);
  };
  $('#photo-input').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    const isVideo = /^video\//.test(file.type) || /\.(mp4|mov|m4v|webm)$/i.test(file.name || '');
    if (isVideo && file.size > VIDEO_MAX_MB*1024*1024){ toast('Il video è troppo pesante (massimo ' + VIDEO_MAX_MB + ' MB): scegline uno più corto.'); return; }
    try { if (isVideo) await useVideo(file, null); else await usePhoto(file, null); }
    catch (err){ mediaStatus(''); toast(isVideo ? 'Non riesco a usare questo video su questo telefono. Prova con un altro.' : 'Non riesco a leggere questa foto. Prova con un JPG o PNG.'); }
  };
  $('#px-open').onclick = () => openPixabay(sign, async (blob, hit, kind) => {
    const credit = { user: hit.user, page: hit.page, src: hit.src };
    try { if (kind === 'video') await useVideo(blob, credit); else await usePhoto(blob, credit); }
    catch (err){ mediaStatus(''); toast('Non riesco a usare questo contenuto. Provane un altro.'); }
  });
  $$('#kb .pill').forEach(b => b.onclick = () => { s.kb = b.dataset.v; $$('#kb .pill').forEach(x => x.classList.toggle('selected', x === b)); touch(); draw(); });
  $$('#pos .seg-btn').forEach(b => b.onclick = () => { s.pos = b.dataset.v; $$('#pos .seg-btn').forEach(x => x.classList.toggle('selected', x === b)); touch(); draw(); });
  $('#txt').oninput = e => { s.text = e.target.value; touch(); draw(); };
  $('#promo').oninput = e => { s.promo = e.target.value; $('#promo-pos-wrap').hidden = !s.promo.trim(); touch(); draw(); };
  $$('#promo-pos .seg-btn').forEach(b => b.onclick = () => { s.promoPos = b.dataset.v; $$('#promo-pos .seg-btn').forEach(x => x.classList.toggle('selected', x === b)); touch(); draw(); });
  const cp = $('#copy-prev'); if (cp) cp.onclick = () => { const prev = p.slides[idx-1]; s.text = prev.text; s.promo = prev.promo; $('#txt').value = s.text; $('#promo').value = s.promo; $('#promo-pos-wrap').hidden = !(s.promo || '').trim(); touch(); draw(); };
  const ca = $('#copy-all'); if (ca) ca.onclick = () => { p.slides.forEach(x => { x.text = s.text; x.promo = s.promo; }); touch(); toast('Scritta applicata a tutte le foto'); };
  const sg = $('#show-grid'); if (sg) sg.onclick = () => go('editor', Object.assign({}, params, { showGrid:true }));
  $$('.trans-item').forEach(b => b.onclick = () => {
    const v = b.dataset.t;
    if (v === 'mix'){ p.mix = true; remixFrom(p, idx); }
    else { s.transIn = v; if (isFirst) p.mix = false; }
    $$('.trans-item').forEach(x => x.classList.toggle('selected', v === 'mix' ? x.dataset.t === 'mix' : x.dataset.t === v));
    touch(); if (v === 'mix') toast('Mix attivo: le prossime foto avranno transizioni diverse');
  });
  startThumbs(app);

  const dropEmpty = () => { if (!s.photo && p.slides.length > 1) p.slides.splice(idx, 1); };
  const add = $('#add');
  if (add) add.onclick = () => {
    if (!s.photo){ toast('Carica prima la foto.'); return; }
    const ns = newSlide(); ns.pos = s.pos; ns.kb = 'auto';
    ns.transIn = p.mix ? randomTrans(p.slides[p.slides.length-1].transIn) : (p.slides[p.slides.length-1].transIn || 'fade');
    p.slides.push(ns); touch(); go('editor', { index:p.slides.length-1, mode:'build' });
  };
  const create = $('#create');
  if (create) create.onclick = async () => {
    const ready = p.slides.filter(x => x.photo);
    if (ready.length < rule.min){ await infoModal('Serve almeno ' + (rule.min === 1 ? 'una foto' : rule.min + ' foto'), 'Per uno spot da ' + p.duration + ' secondi carica almeno ' + rule.min + (rule.min === 1 ? ' foto.' : ' foto. Ne hai ' + ready.length + '.')); return; }
    p.slides = ready;
    if (p.mix) p.outroTrans = randomTrans(p.slides[p.slides.length-1].transIn);
    touch(); await saveNow(); go('review');
  };
  const done = $('#done');
  if (done) done.onclick = () => { dropEmpty(); touch(); go('review'); };
  bindTopbar(() => {
    if (mode === 'edit'){ dropEmpty(); touch(); go('review'); return; }
    if (idx > 0){ dropEmpty(); touch(); go('editor', { index: Math.min(idx - 1, p.slides.length - 1), mode:'build' }); }
    else go('duration');

}

/* ---------- Step 5: revisione ---------- */
let player = null;
function stopPlayer(){ if (player){ player.stopped = true; cancelAnimationFrame(player.raf); player = null; } pauseAllVideos(); }
async function renderReview(){
  const p = project, sign = signOf(p), rule = DURATIONS[p.duration];
  p.slides = p.slides.filter(s => s.photo);
  const n = p.slides.length;
  await loadAssets(p); await ensureFonts(p);
  const segs = timeline(p);
  const canExport = n >= rule.min && n <= rule.max;
  const thumbImg = src => src ? '<img src="' + src + '" alt="">' : '';
  let tl = '<li class="tl-card fixed"><button class="tl-thumb logo" style="background:' + p.logoBg + '" data-seek="0" aria-label="Vai al logo iniziale">' + thumbImg(p.logo) + '</button><div class="tl-body"><strong>Logo iniziale</strong><small>' + String(INTRO).replace('.', ',') + ' secondi</small></div></li>';
  segs.filter(x => x.type === 'slide').forEach(seg => {
    const s = seg.slide, i = seg.i, small = measureShrink(s, p) < .8;
    tl += '<li class="tl-trans"><button data-tr="' + i + '">Transizione: ' + esc(transLabel(s.transIn)) + '</button></li>' +
      '<li class="tl-card"><button class="tl-thumb" data-seek="' + (seg.start + .6).toFixed(2) + '" aria-label="Vai alla foto ' + (i + 1) + '">' + thumbImg(s.photo) + '</button>' +
      '<div class="tl-body"><strong>Foto ' + (i + 1) + '</strong><small>' + (s.text.trim() ? esc(s.text.trim()) : 'Nessuna scritta') + (s.promo.trim() ? ' — ' + esc(s.promo.trim()) : '') + '</small>' + (small ? '<span class="tl-warn">Testo lungo: risulterà piccolo</span>' : '') + '</div>' +
      '<div class="tl-actions"><button class="btn btn-secondary" data-edit="' + i + '">Modifica</button>' +
      (i > 0 ? '<button class="btn btn-secondary" data-up="' + i + '" aria-label="Sposta prima">↑</button>' : '') +
      (i < n - 1 ? '<button class="btn btn-secondary" data-down="' + i + '" aria-label="Sposta dopo">↓</button>' : '') +
      (n > 1 ? '<button class="btn btn-ghost" data-del="' + i + '">Togli</button>' : '') + '</div></li>';
  });
  const outro = segs[segs.length - 1];
  tl += '<li class="tl-trans"><button data-tr="outro">Transizione: ' + esc(transLabel(p.outroTrans)) + '</button></li>' +
    '<li class="tl-card fixed"><button class="tl-thumb logo" style="background:' + p.logoBg + '" data-seek="' + (outro.start + .5).toFixed(2) + '" aria-label="Vai alla chiusura">' + thumbImg(p.logo) + '</button><div class="tl-body"><strong>Chiusura</strong><small>Logo</small></div></li>';

  app.innerHTML = topbar('Il tuo spot', 4) +
    '<section class="panel">' + screenHTML(sign, '<canvas id="pl-canvas"></canvas>') +
    '<div class="player-ctrl"><button class="icon-btn" id="pl-play" aria-label="Pausa">❚❚</button><input type="range" id="pl-seek" min="0" max="' + p.duration + '" step="0.01" value="0" aria-label="Posizione nel video"><span class="time" id="pl-time">0:00 / ' + fmtTime(p.duration) + '</span></div>' +
    '<label class="led-toggle"><input type="checkbox" id="pl-led"' + (params.led ? ' checked' : '') + '> Mostra i pixel reali dell\'insegna</label>' +
    '<p class="hint small center">Insegna ' + esc(signLabel(sign)) + ', definizione video ' + sign.w + 'x' + sign.h + '</p></section>' +
    '<section class="panel"><h2>Durata</h2><div class="seg" id="dur">' + [15, 30, 45].map(d => '<button type="button" class="seg-btn' + (p.duration === d ? ' selected' : '') + '" data-v="' + d + '">' + d + ' secondi</button>').join('') + '</div>' +
    (n < rule.min ? '<p class="warn">Per ' + p.duration + ' secondi servono almeno ' + rule.min + ' foto: aggiungine ' + (rule.min - n) + '.</p>' : '') + '</section>' +
    '<section class="panel"><h2>Sequenza</h2><p class="hint">Cambia solo quello che ti serve: il resto dello spot resta com\'è. Tocca una miniatura per vederla nell\'anteprima.</p>' +
    '<ol class="tl">' + tl + '</ol>' +
    '<div class="btn-row"><button class="btn btn-secondary btn-sm" id="remix">Rimescola le transizioni</button><button class="btn btn-secondary btn-sm" id="add"' + (n >= rule.max ? ' disabled' : '') + '>Aggiungi foto</button></div></section>' +
    '<div class="actionbar"><button class="btn btn-primary btn-block" id="export"' + (canExport ? '' : ' disabled') + '>Esporta il video</button></div>';

  // player
  const cv = $('#pl-canvas'), W = sign.w*PREVIEW_SCALE, H = sign.h*PREVIEW_SCALE; cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d'), seek = $('#pl-seek'), time = $('#pl-time'), playBtn = $('#pl-play');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pl = { t: clamp(params.seek || 0, 0, p.duration), playing: !reduce, last: performance.now(), dirty: true, raf: 0, stopped: false, led: !!params.led };
  const hiC = makeCanvas(sign.w*EXPORT_SCALE, sign.h*EXPORT_SCALE), natC = makeCanvas(sign.w, sign.h);
  const hasVid = p.slides.some(x => videoOf(x));
  if (hasVid) videoStates(p, segs, 0).forEach(v => v.el.addEventListener('seeked', () => { if (player === pl) pl.dirty = true; }));
  const drawPlayer = () => {
    if (pl.led){
      renderAt(hiC.getContext('2d'), hiC.width, hiC.height, pl.t, p, segs);
      const n2 = natC.getContext('2d'); n2.imageSmoothingEnabled = true; n2.imageSmoothingQuality = 'high'; n2.drawImage(hiC, 0, 0, sign.w, sign.h);
      ctx.imageSmoothingEnabled = false; ctx.drawImage(natC, 0, 0, W, H); ctx.imageSmoothingEnabled = true;
    } else renderAt(ctx, W, H, pl.t, p, segs);
  };
  const setPlayIcon = () => { playBtn.textContent = pl.playing ? '❚❚' : '▶'; playBtn.setAttribute('aria-label', pl.playing ? 'Pausa' : 'Riproduci'); };
  const loop = (now) => {
    if (pl.stopped) return;
    const dt = Math.min(.1, (now - pl.last)/1000); pl.last = now;
    if (pl.playing){ pl.t += dt; if (pl.t >= p.duration) pl.t = 0; pl.dirty = true; }
    if (hasVid){ syncVideos(p, segs, pl.t, pl.playing); if (!pl.playing && videoStates(p, segs, pl.t).some(v => v.active && v.el.seeking)) pl.dirty = true; }
    if (pl.dirty){ drawPlayer(); seek.value = pl.t.toFixed(2); time.textContent = fmtTime(pl.t) + ' / ' + fmtTime(p.duration); pl.dirty = false; }
    pl.raf = requestAnimationFrame(loop);
  };
  stopPlayer(); player = pl; setPlayIcon(); pl.raf = requestAnimationFrame(loop);
  playBtn.onclick = () => { pl.playing = !pl.playing; pl.last = performance.now(); setPlayIcon(); };
  seek.oninput = () => { pl.t = +seek.value; pl.dirty = true; };
  $('#pl-led').onchange = e => { pl.led = e.target.checked; params.led = pl.led; pl.dirty = true; };
  $$('[data-seek]').forEach(b => b.onclick = () => { pl.t = +b.dataset.seek; pl.dirty = true; window.scrollTo({ top:0, behavior: reduce ? 'auto' : 'smooth' }); });

  $$('#dur .seg-btn').forEach(b => b.onclick = async () => {
    const d = +b.dataset.v, r = DURATIONS[d];
    if (d === p.duration) return;
    if (n > r.max){ await infoModal('Troppe foto per ' + d + ' secondi', 'Con ' + d + ' secondi puoi usare al massimo ' + r.max + ' foto. Togline ' + (n - r.max) + ' dalla sequenza e riprova.'); return; }
    p.duration = d; touch(); go('review');
  });
  $$('[data-tr]').forEach(b => b.onclick = () => openTransSheet(b.dataset.tr));
  $$('[data-edit]').forEach(b => b.onclick = () => go('editor', { index:+b.dataset.edit, mode:'edit' }));
  $$('[data-up]').forEach(b => b.onclick = () => { const i = +b.dataset.up; const t = p.slides[i-1]; p.slides[i-1] = p.slides[i]; p.slides[i] = t; touch(); go('review', { seek: pl.t }); });
  $$('[data-down]').forEach(b => b.onclick = () => { const i = +b.dataset.down; const t = p.slides[i+1]; p.slides[i+1] = p.slides[i]; p.slides[i] = t; touch(); go('review', { seek: pl.t }); });
  $$('.tl-actions [data-del]').forEach(b => b.onclick = async () => {
    const i = +b.dataset.del; const ok = await confirmModal('Togliere la foto ' + (i + 1) + '?', 'La foto viene tolta da questo spot. Le altre restano come sono.', 'Togli foto', true);
    if (!ok) return; p.slides.splice(i, 1); touch(); go('review');
  });
  $('#remix').onclick = () => { p.mix = true; remixFrom(p, 0); touch(); toast('Transizioni rimescolate'); go('review', { seek:0 }); };
  $('#add').onclick = () => {
    const last = p.slides[p.slides.length - 1]; const ns = newSlide(); ns.pos = last ? last.pos : 'bottom';
    ns.transIn = p.mix ? randomTrans(last && last.transIn) : ((last && last.transIn) || 'fade');
    p.slides.push(ns); touch(); go('editor', { index:p.slides.length - 1, mode:'edit' });
  };
  $('#export').onclick = () => openExport();
  bindTopbar(async () => { await saveNow(); go('home'); });
}

function openTransSheet(key){
  const p = project; const isOutro = key === 'outro';
  const cur = isOutro ? p.outroTrans : p.slides[+key].transIn;
  modalRoot.innerHTML = '<div class="overlay sheet-overlay" id="sheet-ov"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h3>Scegli la transizione</h3><button class="icon-btn" id="sheet-x" aria-label="Chiudi">✕</button></div><p class="hint">' + (isOutro ? 'Passaggio verso la chiusura con il logo.' : 'Ingresso della foto ' + (+key + 1) + '.') + '</p>' + transGridHTML(cur, false, false) + '</div></div>';
  startThumbs(modalRoot);
  $('#sheet-x').onclick = closeModal;
  $('#sheet-ov').onclick = e => { if (e.target.id === 'sheet-ov') closeModal(); };
  $$('.trans-item', modalRoot).forEach(b => b.onclick = () => {
    const v = b.dataset.t; let seekT = 0;
    const segs = timeline(p);
    if (isOutro){ p.outroTrans = v; seekT = segs[segs.length - 1].start - 1; }
    else { p.slides[+key].transIn = v; seekT = segs[+key + 1].start - 1; }
    touch(); closeModal(); go('review', { seek: Math.max(0, seekT) });
  });
}

/* =====================================================================
   ESPORTAZIONE VIDEO
   ===================================================================== */
function fileName(p, ext){
  const sign = signOf(p);
  const base = (p.bizName || 'SPOT').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'SPOT';
  return base + '_' + p.duration + '_' + sign.w + 'X' + sign.h + '.' + ext;
}
async function exportVideo(p, onProg){
  await loadAssets(p); await ensureFonts(p);
  const sign = signOf(p), W = sign.w, H = sign.h, S = EXPORT_SCALE;
  const hi = makeCanvas(W*S, H*S), hctx = hi.getContext('2d');
  const out = makeCanvas(W, H), octx = out.getContext('2d');
  const segs = timeline(p); const total = Math.round(p.duration * FPS);
  const drawFrame = t => { renderAt(hctx, W*S, H*S, t, p, segs); octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = 'high'; octx.fillStyle = '#000'; octx.fillRect(0, 0, W, H); octx.drawImage(hi, 0, 0, W, H); };
  const hasVid = p.slides.some(s => videoOf(s));
  const beforeFrame = hasVid ? (t => seekVideosFor(p, segs, t)) : null;
  const liveSync = hasVid ? (t => syncVideos(p, segs, t, true)) : null;
  pauseAllVideos();
  if (window.VideoEncoder && window.VideoFrame && window.Mp4Muxer){
    try { return await exportWebCodecs(out, drawFrame, W, H, total, onProg, beforeFrame); } catch (e){ console.warn('WebCodecs non riuscito, uso MediaRecorder', e); }
  }
  try { return await exportRecorder(out, drawFrame, p.duration, onProg, liveSync); } finally { pauseAllVideos(); }
}
async function exportWebCodecs(out, drawFrame, W, H, total, onProg, beforeFrame){
  const bitrate = Math.max(900000, Math.round(W*H*FPS*1.2));
  let config = null;
  for (const codec of ['avc1.42001f', 'avc1.4d001f', 'avc1.640028', 'avc1.42E01E']){
    const c = { codec, width:W, height:H, bitrate, framerate:FPS };
    try { const sup = await VideoEncoder.isConfigSupported(c); if (sup && sup.supported){ config = c; break; } } catch (e){}
  }
  if (!config) throw new Error('Codec H.264 non disponibile');
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec:'avc', width:W, height:H }, fastStart:'in-memory', firstTimestampBehavior:'offset' });
  let encErr = null;
  const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => { encErr = e; } });
  enc.configure(config);
  for (let i = 0; i < total; i++){
    if (encErr) throw encErr;
    if (beforeFrame) await beforeFrame(i / FPS);
    drawFrame(i / FPS);
    const frame = new VideoFrame(out, { timestamp: Math.round(i*1e6/FPS), duration: Math.round(1e6/FPS) });
    enc.encode(frame, { keyFrame: i % (FPS*2) === 0 }); frame.close();
    if (i % 6 === 0){ onProg(i/total); await new Promise(r => setTimeout(r, 0)); }
    while (enc.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 4));
  }
  await enc.flush(); if (encErr) throw encErr;
  muxer.finalize(); enc.close(); onProg(1);
  return { blob: new Blob([muxer.target.buffer], { type:'video/mp4' }), ext:'mp4' };
}
function exportRecorder(out, drawFrame, dur, onProg, liveSync){
  return new Promise((resolve, reject) => {
    if (typeof MediaRecorder === 'undefined' || !out.captureStream){ reject(new Error('Registrazione video non supportata')); return; }
    const mime = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(t => { try { return MediaRecorder.isTypeSupported(t); } catch (e){ return false; } });
    if (!mime){ reject(new Error('Nessun formato video disponibile')); return; }
    drawFrame(0);
    const rec = new MediaRecorder(out.captureStream(FPS), { mimeType:mime, videoBitsPerSecond:3000000 });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => resolve({ blob: new Blob(chunks, { type: mime.split(';')[0] }), ext: mime.indexOf('mp4') > -1 ? 'mp4' : 'webm' });
    rec.onerror = e => reject(e.error || new Error('Errore di registrazione'));
    rec.start(500);
    const t0 = performance.now();
    const loop = () => {
      const t = (performance.now() - t0)/1000;
      if (t >= dur){ drawFrame(dur - .001); onProg(1); setTimeout(() => rec.stop(), 150); return; }
      if (liveSync) liveSync(t);
      drawFrame(t); onProg(t/dur); requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
}
let downloadsNS = null;
if (window.claude && typeof window.claude.use === 'function'){ window.claude.use('downloads').then(ns => { downloadsNS = ns; }).catch(() => {}); }
async function saveBlob(blob, filename){
  if (downloadsNS){
    try { await downloadsNS.save({ filename, data: blob }); return 'saved'; }
    catch (e){ if (e && e.code === 'declined') return 'declined'; if (e && e.code === 'rate_limited') return 'busy'; }
  }
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000); return 'saved';
}
async function openExport(){
  const p = project, sign = signOf(p);
  const wasPlaying = player && player.playing; if (player) player.playing = false;
  modalRoot.innerHTML = '<div class="overlay"><div class="modal" role="dialog" aria-modal="true" id="ex-modal"><img class="modal-logo" src="' + LOGO_MARK + '" alt=""><h3>Creo il video</h3><p>Resta su questa schermata finché non ha finito.</p><div class="progress"><div class="progress-fill" id="ex-fill"></div></div><p id="ex-status">0%</p></div></div>';
  const fill = $('#ex-fill'), status = $('#ex-status');
  stopPlayer();
  try {
    const res = await exportVideo(p, pr => { const v = Math.round(clamp(pr, 0, 1)*100); fill.style.width = v + '%'; status.textContent = v + '%'; });
    const name = fileName(p, res.ext);
    const file = (typeof File === 'function') ? new File([res.blob], name, { type: res.blob.type || 'video/mp4' }) : null;
    const canShare = !downloadsNS && file && navigator.canShare && (() => { try { return navigator.canShare({ files:[file] }); } catch (e){ return false; } })();
    $('#ex-modal').innerHTML = '<img class="modal-logo" src="' + LOGO_MARK + '" alt=""><h3>Il tuo spot è pronto</h3>' +
      '<p class="file-name">' + esc(name) + '</p><p>' + Math.max(1, Math.round(res.blob.size/1024)) + ' KB, ' + sign.w + 'x' + sign.h + ' px, ' + p.duration + ' secondi, senza audio.</p>' +
      (res.ext !== 'mp4' ? '<p class="warn">Questo browser ha creato il video in formato .webm, che la Jumbo Screen Platform non accetta. Riprova da Chrome aggiornato o da Safari su iPhone.</p>' : '') +
      '<button class="btn btn-primary btn-block" id="ex-dl">Scarica il video (.mp4)</button>' +
      (canShare ? '<button class="btn btn-secondary btn-block" id="ex-share" style="margin-top:8px">Salva nella galleria o invia</button>' : '') +
      '<div class="howto"><strong>Per pubblicarlo sull\'insegna</strong><ol><li>Accedi a platform.jumboscreen.it</li><li>Azione, poi Palinsesto, poi il tasto +</li><li>Sfoglia, scegli il video, imposta le date e premi Invia</li></ol></div>' +
      '<button class="btn btn-ghost btn-block" id="ex-close">Torna allo spot</button>';
    $('#ex-dl').onclick = async () => {
      const r = await saveBlob(res.blob, name);
      if (r === 'saved') toast('Video scaricato'); else if (r === 'busy') toast('Conferma la richiesta di download già aperta.');
    };
    const sh = $('#ex-share');
    if (sh) sh.onclick = async () => { try { await navigator.share({ files:[file], title: name }); } catch (e){ if (e && e.name !== 'AbortError') toast('Condivisione non riuscita: usa Scarica il video.'); } };
    $('#ex-close').onclick = () => { closeModal(); go('review', { seek:0 }); };
  } catch (e){
    console.error(e);
    $('#ex-modal').innerHTML = '<h3>Il video non è stato creato</h3><p>Questo browser non riesce a generare il video. Aggiorna il browser del telefono (Chrome o Safari) e riprova.</p><button class="btn btn-primary btn-block" id="ex-close">Torna allo spot</button>';
    $('#ex-close').onclick = () => { closeModal(); go('review'); };
  }
}

/* =====================================================================
   AVVIO
   ===================================================================== */
go('home');
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai|claudeusercontent/.test(location.hostname)){
  window.addEventListener('load', () => { navigator.serviceWorker.register('service-worker.js').catch(() => {}); });
}
})();
